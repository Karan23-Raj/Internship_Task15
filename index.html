
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping Website</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <h1>ShopEasy</h1>

        <div class="cart">
            🛒 Cart: <span id="cart-count">0</span>
        </div>
    </nav>

    <!-- Main Heading -->
    <section class="heading">
        <h2>Welcome to ShopEasy</h2>
        <p>Find your favourite products at the best prices.</p>
    </section>

    <!-- Products Section -->
    <section class="products">

        <!-- Product 1 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Headphones">
            <h3>Headphones</h3>
            <p>Price: ₹1,499</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

        <!-- Product 2 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Watch">
            <h3>Smart Watch</h3>
            <p>Price: ₹2,499</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

        <!-- Product 3 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Shoes">
            <h3>Sports Shoes</h3>
            <p>Price: ₹1,999</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

        <!-- Product 4 -->
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500" alt="Bag">
            <h3>Travel Bag</h3>
            <p>Price: ₹999</p>
            <button onclick="addToCart()">Add to Cart</button>
        </div>

    </section>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>
</html>
